spring.application.name=weeklyreport
server.port=8080

# PostgreSQL Database — set via environment variables or .env file
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/weeklyreport}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT — set via environment variables or .env file
app.jwt.secret=${JWT_SECRET:WeeklyReportAppDefaultSecretKeyForJWTSigningMustBeAtLeast256BitsLong!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
